server:
  port: 8082

spring:
  application:
    name: file-service
  # 数据库
  datasource:
    url: jdbc:mysql://localhost:3306/lab_file_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0
    timeout: 1000ms
  # Nacos 【正确写法】
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        ip: 127.0.0.1
      config:
        import-check:
          enabled: false  # 关闭 nacos 配置中心检查
  # 文件上传 【合并到这里，不再重复 spring】
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

# MinIO配置
minio:
  endpoint: http://localhost:9005
  access-key: minioadmin
  secret-key: minioadmin
  bucket: lab-files

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.lab.file.fileservice.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.lab.file.fileservice: debug