version: '3.8'

services:
  # Nacos 服务注册与配置中心
  nacos:
    image: nacos/nacos-server:v2.1.0
    container_name: nacos-standalone
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=password
      - MYSQL_SERVICE_DB_NAME=nacos_config
    volumes:
      - ./nacos/logs:/home/nacos/logs
      - ./nacos/conf:/home/nacos/conf
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    restart: on-failure

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: mysql-lab-file
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: lab_file_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./doc/init_database.sql:/docker-entrypoint-initdb.d/init.sql
    restart: on-failure

  # Redis 缓存
  redis:
    image: redis:6.2-alpine
    container_name: redis-lab-file
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: on-failure

  # MinIO 分布式存储
  minio:
    image: minio/minio:RELEASE.2022-08-02T23-59-14Z
    container_name: minio-lab-file
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: on-failure

  # 用户服务
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - nacos
      - mysql
      - redis
    restart: on-failure

  # 文件服务
  file-service:
    build:
      context: .
      dockerfile: Dockerfile.file-service
    container_name: file-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=http://minio:9000
    depends_on:
      - nacos
      - mysql
      - redis
      - minio
    restart: on-failure

  # API 网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    depends_on:
      - nacos
      - user-service
      - file-service
    restart: on-failure

volumes:
  mysql_data:
  redis_data:
  minio_data: